name: Sync upstream

# Keeps this fork close to KeygraphHQ/shannon.
#
# `main` carries the upstream history plus two local commits: this workflow file and the
# non-ASCII blob-read fix. Every run replays those onto the new `upstream/main`, which is
# clean whenever upstream has not touched the same files. When upstream does, the rebase
# stops, an issue is opened (or the standing one commented) and the run fails - that is the
# notification, and it is the one case that needs a human.
#
# This file lives on `main` because GitHub only registers `schedule` and `workflow_dispatch`
# workflows from the default branch.

on:
  schedule:
    # Daily at 03:17 UTC. Off the hour and off :30 so this does not pile onto the fleet's
    # other scheduled jobs.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/KeygraphHQ/shannon.git

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the fork with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM"
          git fetch upstream main

      - name: Rebase main onto upstream
        id: sync
        continue-on-error: true
        run: |
          git checkout main
          git rebase upstream/main

      - name: Push main
        if: steps.sync.outcome == 'success'
        run: |
          git push --force-with-lease origin main
          echo "main rebased onto \`$(git rev-parse --short upstream/main)\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Report the conflict as an issue
        if: steps.sync.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CONFLICTS=$(git diff --name-only --diff-filter=U | tr '\n' ' ')
          git rebase --abort || true
          BODY=$(cat <<EOF
          The scheduled upstream sync could not rebase \`main\` onto \`upstream/main\`.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Upstream commit: \`$(git rev-parse --short upstream/main)\`
          Files in conflict: ${CONFLICTS:-unknown}

          Resolve locally:

          \`\`\`bash
          git fetch upstream main
          git checkout main
          git rebase upstream/main
          # resolve, then:
          git push --force-with-lease origin main
          \`\`\`
          EOF
          )
          # One open issue at a time: reuse the standing one so a persistent conflict does not
          # file a new issue every day.
          EXISTING=$(gh issue list --state open --search 'upstream sync conflict in:title' --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "Upstream sync conflict: main needs a manual rebase" --body "$BODY"
          fi
          echo "Rebase conflict reported." >> "$GITHUB_STEP_SUMMARY"
          exit 1
